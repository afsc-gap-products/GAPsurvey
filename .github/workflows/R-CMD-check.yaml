# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: '3.6.0'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Extract package version from DESCRIPTION
        id: version
        run: |
          VERSION=$(grep "^Version:" DESCRIPTION | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build R package tar.gz
        run: |
          devtools::build(path = getwd())
        shell: Rscript {0}

      - name: Rename tar.gz with version number
        run: |
          mv GAPsurvey*.tar.gz GAPsurvey-${{ steps.version.outputs.version }}.tar.gz
        shell: bash

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: GAPsurvey-${{ steps.version.outputs.version }}-${{ matrix.config.os }}-R${{ matrix.config.r }}
          path: GAPsurvey-*.tar.gz
