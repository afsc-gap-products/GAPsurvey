# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Forces the runner to use Node.js 24, resolving the deprecation warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::knitr, any::rmarkdown, any::here, any::readtext
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Extract package version from DESCRIPTION
        id: version
        run: |
          VERSION=$(grep "^Version:" DESCRIPTION | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and Rename R package
        run: |
          # 1. Clean up any existing tar.gz files to ensure a fresh build
          files <- list.files(pattern = "^GAPsurvey.*\\.tar\\.gz$")
          if (length(files) > 0) file.remove(files)
          
          # 2. Build the package
          pkg_path <- devtools::build(path = getwd())
          
          # 3. Read current version from DESCRIPTION to ensure 100% accuracy
          current_version <- read.dcf("DESCRIPTION")[,"Version"]
          new_name <- paste0("GAPsurvey-", current_version, ".tar.gz")
          
          # 4. Explicitly rename the file
          file.rename(pkg_path, new_name)
          
          # 5. Verify the file exists and has the new name
          if (file.exists(new_name)) {
            message("Successfully created: ", new_name)
          } else {
            stop("FAILED to rename file to: ", new_name)
          }
        shell: Rscript {0}

      - name: Convert GAPsurvey-script.Rmd to .R script
        run: |
          knitr::purl(
            input = here::here("vignettes", "GAPsurvey-script.Rmd"), 
            output = here::here("inst", "r", "GAPsurvey-script.R"), 
            documentation = 2)
          
          aa <- readLines(con = here::here("inst", "r", "GAPsurvey-script.R")) 
          aa <- aa[c(2,20:length(aa))]
          aa <- aa[!grepl(pattern = "## ----", x = aa)]
          aa <- gsub(pattern = "#' ", replacement = "# ", x = aa)
          aa <- gsub(pattern = "# > ", replacement = "# ", x = aa)
          aa <- aa[aa != "# "]
          writeLines(text = aa, con = here::here("inst", "r", "GAPsurvey-script.R"))
        shell: Rscript {0}

      - name: Render README from README.Rmd
        run: |
          rmarkdown::render(here::here("inst", "r", "README.Rmd"),
                            output_dir = "./",
                            output_file = "README.md")
        shell: Rscript {0}

      - name: Commit and push updated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add inst/r/GAPsurvey-script.R README.md
          git commit -m "Update generated files with version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: GAPsurvey-${{ steps.version.outputs.version }}
          # Path explicitly matches the versioned file name we just created
          path: GAPsurvey-${{ steps.version.outputs.version }}.tar.gz
