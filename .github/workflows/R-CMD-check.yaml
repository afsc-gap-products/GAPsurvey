# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: '3.6.0'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Extract package version from DESCRIPTION
        id: version
        run: |
          VERSION=$(grep "^Version:" DESCRIPTION | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build R package tar.gz
        run: |
          devtools::build(path = getwd())
        shell: Rscript {0}

      - name: Rename tar.gz with version number
        run: |
          mv GAPsurvey*.tar.gz GAPsurvey-${{ steps.version.outputs.version }}.tar.gz
        shell: bash

      - name: Convert GAPsurvey-script.Rmd to .R script
        run: |
          knitr::purl(
            input = here::here("vignettes", "GAPsurvey-script.Rmd"), 
            output = here::here("inst", "r", "GAPsurvey-script.R"), 
            documentation = 2)
          
          aa <- readLines(con = here::here("inst", "r", "GAPsurvey-script.R")) 
          aa <- aa[c(2,20:length(aa))]
          aa <- aa[!grepl(pattern = "## ----", x = aa)]
          aa <- gsub(pattern = "#' ", replacement = "# ", x = aa)
          aa <- gsub(pattern = "# > ", replacement = "# ", x = aa)
          aa <- aa[aa != "# "]
          writeLines(text = aa, con = here::here("inst", "r", "GAPsurvey-script.R"))
        shell: Rscript {0}

      - name: Render README from README.Rmd
        run: |
          rmarkdown::render(here::here("inst", "r", "README.Rmd"),
                            output_dir = "./",
                            output_file = "README.md")
        shell: Rscript {0}

      - name: Commit and push updated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add inst/r/GAPsurvey-script.R README.md
          git commit -m "Update generated files with version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: GAPsurvey-${{ steps.version.outputs.version }}-${{ matrix.config.os }}-R${{ matrix.config.r }}
          path: GAPsurvey-*.tar.gz
